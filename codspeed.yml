$schema: https://raw.githubusercontent.com/CodSpeedHQ/codspeed/refs/heads/main/schemas/codspeed.schema.json

# The pytest integration is its own harness; the exec-harness is Linux-only.
benchmarks:
  - id: shell-startup
    entrypoint: python3 -B -m pytest -p no:cacheprovider bench/test_benchmarks.py --codspeed
